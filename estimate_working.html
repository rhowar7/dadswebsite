<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimate Form - Working Version</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .success { color: green; padding: 10px; border: 1px solid green; margin-top: 20px; display: none; }
        .error { color: red; padding: 10px; border: 1px solid red; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <h1>Get a Free Estimate</h1>
    <p>Fill out the form below and we'll get back to you within one business day.</p>

    <form id="estimateForm">
        <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="address">Property Address *</label>
            <input type="text" id="address" required>
        </div>

        <div class="form-group">
            <label for="workType">Type of Work Needed *</label>
            <select id="workType" required>
                <option value="">Select a service...</option>
                <option value="roofing">Roofing — Replacement or Repair</option>
                <option value="siding">Siding — Installation or Repair</option>
                <option value="deck">Deck — New Build or Refinish</option>
                <option value="painting-ext">Painting — Exterior</option>
                <option value="painting-int">Painting — Interior</option>
                <option value="gutters">Gutters — Replacement or Repair</option>
                <option value="repairs">General Repairs</option>
                <option value="other">Other / Not Sure</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Project Description *</label>
            <textarea id="description" required></textarea>
        </div>

        <div class="form-group">
            <label for="timeline">Preferred Timeline</label>
            <select id="timeline">
                <option value="">When would you like work to start?</option>
                <option value="asap">As soon as possible</option>
                <option value="1month">Within 1 month</option>
                <option value="3months">Within 3 months</option>
                <option value="flexible">Flexible / Just planning</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">Submit Estimate Request</button>
    </form>

    <div id="successMsg" class="success">
        ✅ Thank you! Your estimate request has been sent successfully.
    </div>

    <div id="errorMsg" class="error">
        ❌ There was an error sending your request. Please try again or call (443) 829-5946.
    </div>

    <script>
        document.getElementById('estimateForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form data
            const formData = {
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                workType: document.getElementById('workType').value,
                description: document.getElementById('description').value,
                timeline: document.getElementById('timeline').value || 'Not specified'
            };

            // Create email content
            const subject = encodeURIComponent('New Estimate Request from Website');
            const body = encodeURIComponent(
                `New Estimate Request:\n\n` +
                `Name: ${formData.name}\n` +
                `Phone: ${formData.phone}\n` +
                `Email: ${formData.email}\n` +
                `Address: ${formData.address}\n` +
                `Work Type: ${formData.workType}\n` +
                `Timeline: ${formData.timeline}\n\n` +
                `Description:\n${formData.description}\n\n` +
                `---\nSent from Walter's Home Improvement website`
            );

            // Create mailto link
            const mailtoLink = `mailto:whoward45@gmail.com?subject=${subject}&body=${body}`;

            // Show success message
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';

            // Open email client after a short delay
            setTimeout(() => {
                window.location.href = mailtoLink;
            }, 1000);

            console.log('Estimate request prepared for email client');
        });
    </script>
</body>
</html></content>
