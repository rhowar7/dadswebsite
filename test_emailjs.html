<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailJS Test</title>
</head>
<body>
    <h1>EmailJS Configuration Test</h1>
    <button id="testBtn">Test EmailJS Connection</button>
    <div id="result"></div>

    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/emailjs-com/3.2.0/email.min.js"></script>
    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing EmailJS connection...';

            try {
                // Test with the older emailjs-com API
                const response = await emailjs.send(
                    'service_ut61pkj',
                    'template_puxk7oa',
                    {
                        to_email: 'whoward45@gmail.com',
                        from_name: 'EmailJS Test',
                        from_email: 'test@example.com',
                        phone: '(443) 829-5946',
                        address: '123 Test St',
                        work_type: 'Test',
                        description: 'This is a test email to verify EmailJS configuration',
                        timeline: 'ASAP'
                    },
                    '9_j-uvK3QR4l9VL-C'
                );

                resultDiv.innerHTML = `
                    <div style="color: green; padding: 10px; border: 1px solid green; margin: 10px 0;">
                        ✅ SUCCESS: EmailJS is working!<br>
                        Status: ${response.status}<br>
                        Response: ${JSON.stringify(response)}
                    </div>
                `;
                console.log('EmailJS test successful:', response);

            } catch (error) {
                resultDiv.innerHTML = `
                    <div style="color: red; padding: 10px; border: 1px solid red; margin: 10px 0;">
                        ❌ ERROR: EmailJS test failed<br>
                        Status: ${error.status || 'Unknown'}<br>
                        Text: ${error.text || 'Unknown error'}<br>
                        <br>
                        <strong>Possible issues:</strong><br>
                        - EmailJS account not verified<br>
                        - Service ID or Template ID incorrect<br>
                        - Public key expired<br>
                        - EmailJS service down<br>
                        <br>
                        Check your EmailJS dashboard at https://www.emailjs.com/
                    </div>
                `;
                console.error('EmailJS test failed:', error);
            }
        });
    </script>
</body>
</html></content>
